spring.application.name=Teago
spring.datasource.url=${TEAGO_DB_URL:jdbc:mysql://localhost:3306/teago?createDatabaseIfNotExist=true}
spring.datasource.username=${TEAGO_DB_USERNAME:root}
spring.datasource.password=${TEAGO_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
